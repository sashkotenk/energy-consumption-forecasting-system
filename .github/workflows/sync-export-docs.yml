name: Sync export docs

on:
  push:
    branches: [exports]

permissions:
  contents: write

concurrency:
  group: sync-export-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[docs-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply contract documentation patch
        run: git apply --check .task16-docs.patch && git apply .task16-docs.patch

      - name: Remove temporary synchronization files
        run: rm .task16-docs.patch .github/workflows/sync-export-docs.yml

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi-design.yaml docs/implementation-log.md .task16-docs.patch .github/workflows/sync-export-docs.yml
          git commit -m "docs: synchronize export contracts [docs-synced]"
          git push origin HEAD:exports
