name: Finalize TASK-16 evidence

on:
  push:
    branches: [exports-finalize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: exports-finalize

      - name: Record completed CI evidence
        run: python scripts/finalize_task16.py

      - name: Commit evidence update when changed
        run: |
          if git diff --quiet -- docs/implementation-log.md; then
            echo "No documentation change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-log.md
          git commit -m "docs: complete task 16 verification evidence"
          git push origin HEAD:exports-finalize
