name: Record TASK-18 implementation

on:
  push:
    branches: [frontend-core]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: frontend-core
          fetch-depth: 0

      - name: Append implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## TASK-18 — React product foundation$' docs/implementation-log.md; then
            git rm .github/workflows/task18-log.yml
          else
            if [[ "$(tail -n 1 docs/implementation-log.md)" != "TASK-18 has not been started." ]]; then
              echo "Unexpected implementation log trailer" >&2
              exit 1
            fi
            sed -i '$d' docs/implementation-log.md
            printf '%s' '' | base64 --decode >> docs/implementation-log.md
            git rm .github/workflows/task18-log.yml
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-log.md
          git commit -m "docs: record TASK-18 verification"
          git push origin HEAD:frontend-core
