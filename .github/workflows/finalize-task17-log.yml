name: Finalize TASK-17 verification log

on:
  push:
    branches: [openapi-sdk]

permissions:
  contents: write

jobs:
  finalize-log:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: openapi-sdk

      - name: Record TASK-17 verification evidence
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/implementation-log.md')
          text = path.read_text(encoding='utf-8')
          marker = '## TASK-17 — OpenAPI synchronization and generated TypeScript SDK'
          if marker not in text:
              raise SystemExit('TASK-17 log marker not found')
          prefix = text.split(marker, 1)[0].rstrip()
          section = '''## TASK-17 — OpenAPI synchronization and generated TypeScript SDK

          **Date:** 2026-08-08
          **Status:** implemented and repository-wide CI verified

          **Scope:** authoritative FastAPI OpenAPI 3.1 export; stable explicit operation IDs for every
          implemented endpoint; deterministic `docs/api/openapi.json`; generated TypeScript
          `typescript-fetch` SDK under `frontend/src/generated/api`; OpenAPI contract tests; and
          CI/full-gate runtime-contract plus generated-SDK drift verification. Generated files are never
          hand-edited and no handwritten duplicate API DTO layer is introduced.

          ### Generation and dependency decision

          No npm dependency was added for code generation. The SDK is generated by the pinned
          `openapitools/openapi-generator-cli:v7.24.0` container. The successful CI pull resolved digest
          `sha256:5bf3dc75f764c584da8e3344c51b2f3f1e74703461d46a035b5ac1d31515cc88`.
          Hey API 0.99.0/0.97.0 and Orval 8.23.0 were evaluated during implementation but rejected after
          npm audit exposed high or moderate vulnerable dependency chains. With the selected approach,
          `npm ci` audited 276 packages and reported 0 vulnerabilities; the separate generation bootstrap
          also ran `npm audit` successfully with 0 vulnerabilities. No backend runtime dependency changed.

          ### Contract and architecture impact

          The implemented FastAPI schema is authoritative for implemented HTTP contracts.
          `docs/api/openapi-design.yaml` remains a design reference; deterministic `docs/api/openapi.json`
          is the code-generation input. All 33 implemented operations have stable explicit unique
          `operationId` values. Problem Details responses use `application/problem+json` with the typed
          `Problem` schema, nullable fields remain explicit, and job status/type enums are contract-tested.
          CI regenerates runtime OpenAPI and the TypeScript SDK and rejects drift. The root `.gitignore`
          explicitly permits generated SDK model sources while continuing to ignore runtime ML model
          artifacts. No database schema, DDL or Alembic migration changed.

          ### Verification evidence

          TASK-17 PR #17 Baseline CI run 36 completed successfully on the feature-branch merge candidate.
          Before that repository-wide gate, the generation bootstrap also passed the three new OpenAPI
          contract tests, changed-source Ruff checks, SDK generation, npm audit, frontend typecheck,
          production build and `git diff --check`.

          | CI job | Command / gate | Actual result |
          |---|---|---|
          | Backend | `uv sync --all-groups --frozen` | exit 0; 45 locked packages installed |
          | Backend | `uv run --frozen ruff check .` | exit 0; all checks passed |
          | Backend | `uv run --frozen ruff format --check .` | exit 0; 132 files already formatted |
          | Backend | `uv run --frozen mypy src tests` | exit 0; no issues in 128 source files |
          | Backend | `uv run --frozen python ../scripts/export_openapi.py --check` | exit 0; OpenAPI contract synchronized |
          | Backend | `uv run --frozen alembic upgrade head` | exit 0; migrations applied through `c3d9a5f27410` |
          | Backend | `uv run --frozen alembic check` | exit 0; `No new upgrade operations detected.` |
          | Backend | `uv run --frozen pytest -m "not performance"` | exit 0; 190 collected, 2 deselected, 188 passed, 0 failed, 0 skipped in 41.93 s |
          | Frontend | `npm ci` | exit 0; 275 packages added, 276 audited, 0 vulnerabilities |
          | Frontend | `npm run api:check` | exit 0; deterministic SDK regeneration produced no tracked diff |
          | Frontend | `npm run lint` | exit 0; 0 errors, 3 generated-file unused-disable warnings |
          | Frontend | `npm run typecheck` | exit 0; TypeScript build-mode check passed |
          | Frontend | `npm run test -- --run` | exit 0; 1 file, 1 test passed, 0 failed |
          | Frontend | `npm run build` | exit 0; 29 modules transformed; 193.98 kB JS bundle (61.16 kB gzip) |

          The generator reports that its OpenAPI 3.1 support is beta; this is retained as a known tooling
          limitation rather than hidden. The risk is bounded by the explicit contract tests, deterministic
          drift checks, generated SDK typecheck and production build.

          TASK-18 has not been started.
          '''
          import textwrap
          path.write_text(prefix + '\n\n' + textwrap.dedent(section).strip() + '\n', encoding='utf-8')

      - name: Commit verification log
        run: |
          if git diff --quiet -- docs/implementation-log.md; then
            echo "No log change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-log.md
          git commit -m "docs: record TASK-17 verification evidence"
          git push origin HEAD:openapi-sdk
