name: Bootstrap generated SDK models

on:
  push:
    branches: [openapi-sdk]

permissions:
  contents: write

jobs:
  generate-models:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: openapi-sdk

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate SDK
        working-directory: frontend
        run: npm run api:generate

      - name: Type check generated SDK
        working-directory: frontend
        run: npm run typecheck

      - name: Commit generated model sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/src/generated/api/models
          if git diff --cached --quiet; then
            echo "Generated model sources already tracked."
            exit 0
          fi
          git commit -m "fix: track generated API model sources"
          git push origin HEAD:openapi-sdk
