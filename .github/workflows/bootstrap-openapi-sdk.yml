name: Bootstrap TASK-17 generated artifacts

on:
  push:
    branches: [openapi-sdk]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: openapi-sdk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply TASK-17 repository patch
        run: |
          python scripts/prepare_task17.py
          python scripts/prepare_task17_problem_schema.py
          python scripts/prepare_task17_codegen_version.py

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Format changed Python sources
        working-directory: backend
        run: >-
          uv run --frozen ruff format
          src/energy_forecast/api.py
          src/energy_forecast/experiments/api.py
          src/energy_forecast/forecasting/api.py
          src/energy_forecast/exports/api.py
          tests/unit/test_openapi_contract.py
          ../scripts/export_openapi.py

      - name: Export authoritative OpenAPI
        working-directory: backend
        run: uv run --frozen python ../scripts/export_openapi.py

      - name: Verify OpenAPI contract tests
        working-directory: backend
        run: uv run --frozen pytest tests/unit/test_openapi_contract.py -q

      - name: Lint changed backend sources
        working-directory: backend
        run: >-
          uv run --frozen ruff check
          src/energy_forecast/api.py
          src/energy_forecast/experiments/api.py
          src/energy_forecast/forecasting/api.py
          src/energy_forecast/exports/api.py
          tests/unit/test_openapi_contract.py
          ../scripts/export_openapi.py

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Generate TypeScript SDK
        working-directory: frontend
        run: npm run api:generate

      - name: Type check generated SDK
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend with generated SDK
        working-directory: frontend
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated artifacts and TASK-17 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add \
            backend/tests/unit/test_openapi_contract.py \
            docs/api/openapi.json \
            frontend/src/generated/api \
            scripts/export_openapi.py \
            scripts/generate_api_sdk.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: synchronize OpenAPI and generate TypeScript SDK"
          git push origin HEAD:openapi-sdk
