name: Release Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and evidence structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/verify_documentation.py
      - name: Verify deterministic demo dataset generator
        run: |
          python scripts/generate_demo_dataset.py --output /tmp/demo-energy.csv --days 60
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('/tmp/demo-energy.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.reader(handle))
          assert rows[0] == ['timestamp', 'energy_kwh']
          assert len(rows) == 60 * 24 + 1
          PY
      - name: Verify evidence manifest when present
        run: |
          if [[ -f docs/evidence/handoff-manifest.json ]]; then
            python scripts/verify_evidence.py
          fi

  benchmark:
    name: Deterministic release benchmark
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://energyforecast:energyforecast@localhost:5432/energyforecast
      TEST_DATABASE_URL: postgresql+asyncpg://energyforecast:energyforecast@localhost:5432/energyforecast
    services:
      db:
        image: timescale/timescaledb:2.28.3-pg17
        env:
          POSTGRES_DB: energyforecast
          POSTGRES_USER: energyforecast
          POSTGRES_PASSWORD: energyforecast
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energyforecast -d energyforecast"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --frozen
      - name: Run deterministic benchmark
        run: uv run --frozen python ../scripts/generate_release_benchmark.py --output ../release-evidence/release-benchmark.json
      - name: Run performance regression marker
        run: uv run --frozen pytest -m performance
      - uses: actions/upload-artifact@v7
        with:
          name: release-benchmark-${{ github.sha }}
          path: release-evidence/release-benchmark.json
          if-no-files-found: error
          retention-days: 14

  browser-evidence:
    name: Browser and frontend evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production frontend and record Vite bundle sizes
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: error
          retention-days: 14
