name: Refresh test dependency locks

on:
  push:
    branches: [test-suite]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: test-suite

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"

      - name: Refresh backend lock
        working-directory: backend
        run: uv lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Refresh frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lock updates
        shell: bash
        run: |
          if git diff --quiet -- backend/uv.lock frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock frontend/package-lock.json
          git commit -m "chore: refresh test dependency locks"
          git push origin HEAD:test-suite
