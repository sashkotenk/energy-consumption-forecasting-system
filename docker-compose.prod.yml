services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production-like deployment}

  migrate:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production-like deployment}
      CODE_COMMIT: ${CODE_COMMIT:?CODE_COMMIT is required for production-like deployment}

  api:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production-like deployment}
      CODE_COMMIT: ${CODE_COMMIT:?CODE_COMMIT is required for production-like deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production-like deployment}
      CODE_COMMIT: ${CODE_COMMIT:?CODE_COMMIT is required for production-like deployment}

  nginx:
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
