name: energyforecast

x-backend-build: &backend-build
  context: ./backend
  args:
    APP_VERSION: ${APP_VERSION:-0.1.0}
    CODE_COMMIT: ${CODE_COMMIT:-development}
    SOURCE_URL: https://github.com/sashkotenk/energy-consumption-forecasting-system

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://energyforecast:energyforecast@db:5432/energyforecast}
  ARTIFACT_ROOT: /var/lib/energyforecast/artifacts
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  MAX_UPLOAD_BYTES: "314572800"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CODE_COMMIT: ${CODE_COMMIT:-development}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
  WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-30}
  WORKER_RECOVERY_BATCH_SIZE: ${WORKER_RECOVERY_BATCH_SIZE:-100}
  WORKER_RUN_ONCE: "false"

x-backend-hardening: &backend-hardening
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=536870912,mode=1777

services:
  db:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energyforecast}
      POSTGRES_USER: ${POSTGRES_USER:-energyforecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energyforecast}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energyforecast} -d ${POSTGRES_DB:-energyforecast}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: energyforecast-backend:${APP_VERSION:-0.1.0}
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      APP_SERVICE: api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    <<: *backend-hardening

  api:
    image: energyforecast-backend:${APP_VERSION:-0.1.0}
    build: *backend-build
    command: ["energy-forecast-api"]
    environment:
      <<: *backend-environment
      APP_SERVICE: api
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifact_data:/var/lib/energyforecast/artifacts
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          root=os.environ['ARTIFACT_ROOT'];
          assert os.path.isdir(root) and os.access(root, os.W_OK);
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    <<: *backend-hardening

  worker:
    image: energyforecast-backend:${APP_VERSION:-0.1.0}
    build: *backend-build
    command: ["energy-forecast-worker"]
    environment:
      <<: *backend-environment
      APP_SERVICE: worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifact_data:/var/lib/energyforecast/artifacts
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 45s
    <<: *backend-hardening

  web:
    image: energyforecast-web:${APP_VERSION:-0.1.0}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        CODE_COMMIT: ${CODE_COMMIT:-development}
        SOURCE_URL: https://github.com/sashkotenk/energy-consumption-forecasting-system
        VITE_API_BASE_URL: /api/v1
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    restart: unless-stopped

  nginx:
    image: energyforecast-nginx:${APP_VERSION:-0.1.0}
    build:
      context: ./infrastructure/nginx
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        CODE_COMMIT: ${CODE_COMMIT:-development}
        SOURCE_URL: https://github.com/sashkotenk/energy-consumption-forecasting-system
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    restart: unless-stopped

networks:
  edge:
    internal: false
  backend:
    internal: true

volumes:
  postgres_data:
  artifact_data:
